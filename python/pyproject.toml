[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cint-gpw"
version = "0.2.0"
description = "Standalone NumPy/PySCF interface to libcint GPW integrals"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
py-modules = ["cint_gpw"]
